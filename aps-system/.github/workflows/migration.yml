name: Database Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Migration mode'
        required: true
        default: 'up'
        type: choice
        options:
          - up
          - down
          - fresh

jobs:
  migrate:
    name: Run Database Migration
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aps_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apps/api && npm ci

      - name: Run migrations
        run: |
          cd apps/api
          case "${{ inputs.mode }}" in
            up)
              npm run typeorm:migration:run
              ;;
            down)
              npm run typeorm:migration:revert
              ;;
            fresh)
              npm run typeorm:schema:drop
              npm run typeorm:migration:run
              ;;
          esac
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: aps_db

      - name: Seed database (optional)
        if: inputs.mode == 'fresh'
        run: |
          cd apps/api && npm run seed
