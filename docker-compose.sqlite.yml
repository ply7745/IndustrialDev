version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/industrial_dev.db
      - NODE_ENV=production
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - web_dist:/app/web-dist
    depends_on:
      - api
    restart: unless-stopped

  # 用于复制前端文件的初始化容器
  init-web:
    build: .
    volumes:
      - web_dist:/app/web-dist
    command: sh -c "cp -r /app/web-dist/* /app/web-dist-target/ 2>/dev/null || true"
    volumes:
      - web_dist:/app/web-dist-target

volumes:
  sqlite_data:
  web_dist:
